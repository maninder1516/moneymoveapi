monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: info
                channels: ["!event", "!doctrine", "!security"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Main application logs - only WARNING and above
            main:
                type: fingers_crossed
                action_level: warning
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!event", "!doctrine", "!security"]
                buffer_size: 50
            nested:
                type: stream
                path: "%kernel.logs_dir%/app.log"
                level: warning
                formatter: monolog.formatter.json
            # Critical business operations (transfers, account operations)
            business:
                type: stream
                path: "%kernel.logs_dir%/business.log"
                level: info
                channels: ["app"]
                formatter: monolog.formatter.json
            # Error logs for debugging
            error:
                type: stream
                path: "%kernel.logs_dir%/error.log"
                level: error
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: "%kernel.logs_dir%/deprecations.log"
                formatter: monolog.formatter.json

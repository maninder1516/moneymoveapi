framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        prefix_seed: 'moneymove_api'

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        app: cache.adapter.filesystem

        # The "system" cache is for system-wide information.
        system: cache.adapter.system

        # Custom cache pools for different use cases
        pools:
            # Currency rates cache pool with filesystem adapter (fallback)
            currency.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 3600 # 1 hour
                
            # Redis cache pool (will be used when Redis is available)
            redis.cache:
                adapter: cache.adapter.redis
                provider: 'redis://localhost:6379/0'
                default_lifetime: 1800 # 30 minutes
                
            # General application cache
            app.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 1800 # 30 minutes

api:
  # API Configuration
  version:
    current: v1
    supported: [v1, v2]
    deprecation_notice: "API v1 will be deprecated on 2025-12-31"
  
  # Rate limiting (if you implement it later)
  rate_limit:
    requests_per_minute: 60
    burst_limit: 100
  
  # Response format
  response_format:
    success_field: success
    data_field: data
    message_field: message
    errors_field: errors
  
  # CORS settings
  cors:
    allow_origins: ['*']
    allow_headers: ['Content-Type', 'Authorization', 'X-Requested-With']
    allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']